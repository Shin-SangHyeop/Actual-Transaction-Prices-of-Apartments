name: Daily Kakao apartment report

on:
  schedule:
    - cron: "0 6 * * *"
      timezone: "Asia/Seoul"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-kakao-report
  cancel-in-progress: false

jobs:
  send:
    runs-on: windows-latest
    env:
      PYTHONUTF8: "1"
    steps:
      - name: Check out application
        uses: actions/checkout@v4

      - name: Check out encrypted token state
        uses: actions/checkout@v4
        with:
          ref: kakao-state
          path: private-state

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Fetch transactions and send Kakao messages
        env:
          APP_SETTINGS_YAML: ${{ secrets.APP_SETTINGS_YAML }}
          KAKAO_STATE_KEY: ${{ secrets.KAKAO_STATE_KEY }}
        run: python daily_sender.py

      - name: Persist rotated Kakao tokens
        if: always()
        working-directory: private-state
        shell: pwsh
        run: |
          if (Test-Path user_settings.enc) {
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -- user_settings.enc
            $changes = git status --porcelain
            if ($changes) {
              git commit -m "Update encrypted Kakao token state"
              if ($LASTEXITCODE -ne 0) { throw "Could not commit encrypted token state" }
              git push origin HEAD:kakao-state
              if ($LASTEXITCODE -ne 0) { throw "Could not persist encrypted token state" }
            }
          }
